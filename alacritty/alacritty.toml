[general]
live_config_reload = true
import = [
  # "~/.config/alacritty/themes/dreamsof.toml"
  # "~/.config/alacritty/themes/catppuccin-latte.toml"
  "~/.config/alacritty/themes/sweetie_light.toml"
]

[bell]
animation = "EaseOutExpo"
duration = 0

[colors]
draw_bold_text_with_bright_colors = true

[font]
size = 16

[font.normal]
#family = "Inconsolata LGC Nerd Font Propo"
#family = "Hack Nerd Font Propo"
family = "AdwaitaMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "AdwaitaMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "AdwaitaMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "AdwaitaMono Nerd Font Mono"
style = "Bold Italic"

[font.glyph_offset]
x = 0
y = 0

[font.offset]
x = 0
y = 0

[window]
padding.x = 4
padding.y = 4
dynamic_padding = true
decorations = "Full"
dynamic_title = true
startup_mode = "Windowed"
opacity = 0.97

[window.dimensions]
columns = 160
lines = 80

# [shell]
# program = "/bin/zsh"

[mouse]
hide_when_typing = true

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

[scrolling]
history = 100000

[keyboard]
bindings = [
    { key = "C", mods = "Control|Shift", action = "Copy" },
    { key = "V", mods = "Control|Shift", action = "Paste" },
    { key = "K", mods = "Control|Shift", action = "IncreaseFontSize" },
    { key = "J", mods = "Control|Shift", action = "DecreaseFontSize" },
    { key = "Space", mods = "Control|Shift", action = "ToggleViMode" },
]

[selection]
save_to_clipboard = true

[cursor]
blink_interval = 500
blink_timeout = 5
unfocused_hollow = false

[cursor.style]
blinking = "Off"
shape = "Block"

[terminal]
# Allow copy operations through OSC 52 (tmux/SSH) without letting remote
# applications read the clipboard.
osc52 = "OnlyCopy"

[env]
ENV = "xterm-256color"
